# Example stagedirector.yml for Maria's Place (lives at the root of that repo).
version: 1
name: Maria's Place
group: Maria's Place
kind: WordPress · Hostinger
branch: main
noDowntime: false
gateRunner: github          # or self-hosted: "Check rules" runs on a runner labelled sd-gate (no GitHub-hosted minutes)
stages:
  - id: local
    name: Local
    url: http://localhost:58410/
    pushers: none
    trigger: manual
  - id: staging
    name: Staging
    url: https://staging.mariasplace.com/
    pushers: developers
    trigger: auto
    deploy: scripts/deploy.sh staging
    rollback: scripts/deploy.sh rollback staging {backup}
    status: scripts/deploy.sh status --json
    smokeTest: [/, /login/, /my-account/, /contact/]
    runner: ovh1
  - id: live
    name: Live site
    url: https://mariasplace.com/
    pushers: code-owners
    trigger: manual
    deploy: scripts/deploy.sh live
    rollback: scripts/deploy.sh rollback live {backup}
    status: scripts/deploy.sh status --json
    smokeTest: [/, /login/, /my-account/, /contact/]
    runner: ovh1
checks: # run by the dashboard in the review step and after each run; results go to History
  - name: Pages load
    pages: [/, /my-account/, /contact/]
  - name: Login page works
    pages: [/login/]
    expect: Lost your password
  - name: No PHP errors
    pages: [/, /login/, /contact/]
    forbid: ["Fatal error", "Parse error", "Warning: ", "There has been a critical error"]
tools:
  clearCache: scripts/clear-cache.sh
  syncCheck: scripts/deploy.sh drift
liveTodo:
  - Repeat any Divi page edits made on staging
