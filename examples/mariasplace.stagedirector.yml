# Example stagedirector.yml for Maria's Place (lives at the root of that repo).
version: 1
name: Maria's Place
group: Maria's Place
kind: WordPress · Hostinger
branch: main
noDowntime: false
# Local Actions by default (sd-gate). Uncomment to spend GitHub-hosted minutes instead:
# gateRunner: github
stages:
  - id: local
    name: Local
    url: http://localhost:58410/
    pushers: none
    trigger: manual
  - id: staging
    name: Staging
    url: https://staging.mariasplace.com/
    pushers: developers
    trigger: auto
    deploy: scripts/deploy.sh staging
    rollback: scripts/deploy.sh rollback staging {backup}
    status: scripts/deploy.sh status --json
    smokeTest: [/, /login/, /my-account/, /contact/]
    runner: ovh1
  - id: live
    name: Live site
    url: https://mariasplace.com/
    pushers: code-owners
    trigger: manual
    deploy: scripts/deploy.sh live
    rollback: scripts/deploy.sh rollback live {backup}
    status: scripts/deploy.sh status --json
    smokeTest: [/, /login/, /my-account/, /contact/]
    runner: ovh1
checks: # run by the dashboard in the review step and after each run; results go to History
  - name: Pages load
    pages: [/, /my-account/, /contact/]
  - name: Login page works
    pages: [/login/]
    expect: Lost your password
  - name: No PHP errors
    pages: [/, /login/, /contact/]
    forbid: ["Fatal error", "Parse error", "Warning: ", "There has been a critical error"]
tools:
  clearCache: scripts/clear-cache.sh
  syncCheck: scripts/deploy.sh drift
  # Valuable live slice → staging (users + pages/posts; not a full DB). See engine/examples/mariasplace/.
  copyLiveToStaging: scripts/copy-live-to-staging.sh
liveTodo:
  - Full backup of live first
  - Remove obsolete plugins/themes from live (deploy will not delete them)
  - Put the lean code live, then push the previewed data set
  - Repeat any Divi page edits made only on staging
