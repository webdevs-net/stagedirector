# Meru STAGING override for deploy/vultr1/docker-compose.yml (copy into Meru as
# deploy/vultr1/docker-compose.staging.yml). Always used with an explicit project name:
#
#   docker compose -p meru-pipeline-staging \
#     -f deploy/vultr1/docker-compose.yml -f deploy/vultr1/docker-compose.staging.yml \
#     --env-file /opt/meru-staging/.env up -d
#
# (stagedirector-remote does exactly this.) The project name gives staging its own containers
# and named volumes. This file gives it its own network, ports, sendgw registry, KV namespace,
# Mailgun webhook key and caps, so it can never reuse live's containers, data or registry.
# NEVER run `docker compose down -v` without `-p meru-pipeline-staging`.
#
# Mail (owner decision): staging sends the same way as live (sendgw -> Mailgun/Gmail), but:
#   * GATEWAY_RECIPIENT_ALLOWLIST is required: mail to anyone else is parked and logged by sendgw;
#   * a small daily cap in staging's own domains.json (STAGING_DAILY_CAP, set there);
#   * tagging: X-Stage: staging header + "[STAGING] " subject prefix. sendgw does NOT do this yet:
#     TODO(Meru): add GATEWAY_STAGE_TAG support to sendgw before the first staging send.

x-staging: &staging
  restart: unless-stopped
  mem_limit: ${STAGING_SERVICE_MEMORY:-384m}
  memswap_limit: ${STAGING_SERVICE_MEMORY:-384m}
  cpus: ${STAGING_SERVICE_CPUS:-0.5}
  pids_limit: 256
  labels:
    stagedirector.stage: staging
    backup.exclude: "true"          # keep staging out of live's backups (check the backup job honours it)

services:
  pipelined:
    <<: *staging
    ports: !override
      - "127.0.0.1:${STAGING_PIPELINE_PORT:-58188}:58088"
    environment:
      DEPLOY_ENV: staging
      DRY_RUN: ${DRY_RUN:-true}
      CF_KV_NAMESPACE_ID: ${CF_KV_NAMESPACE_ID:?staging needs its OWN KV namespace id}
      MAILGUN_WEBHOOK_SIGNING_KEY: ${MAILGUN_WEBHOOK_SIGNING_KEY:?staging needs its own Mailgun webhook key}
      CONFIRM_BASE_URL: ${CONFIRM_BASE_URL:?set staging's confirm URL}
      CALENDAR_ICS_URL: ""            # no calendar polling on staging
      PUSHOVER_TOKEN: ""              # no owner phone alerts from staging
      PUSHOVER_USER: ""
      DISCORD_WEBHOOK_URL: ${STAGING_DISCORD_WEBHOOK_URL:-}
      PIPELITE_URL: ""                # no CRM writes from staging
    volumes: !override
      - pipeline-data:/data
      - ${STAGING_SENDGW_DIR:?set STAGING_SENDGW_DIR (staging's own sendgw registry folder)}:/etc/sendgw:ro
    networks: !override [mautic-staging]

  sendgw:
    <<: *staging
    ports: !override
      - "127.0.0.1:${STAGING_SENDGW_ADMIN_PORT:-58195}:2580"
    environment:
      DEPLOY_ENV: staging
      GATEWAY_RECIPIENT_ALLOWLIST: ${GATEWAY_RECIPIENT_ALLOWLIST:?staging must have a recipient allowlist (owner test addresses)}
      GATEWAY_STAGE_TAG: staging      # TODO(Meru): sendgw adds X-Stage + "[STAGING] " subject prefix when set
    volumes: !override
      - ${STAGING_SENDGW_DIR}:/etc/sendgw
      - gateway-data:/data
    networks: !override [mautic-staging]

networks:
  mautic-staging:
    name: ${STAGING_MAUTIC_NETWORK:-meru-mautic-staging_default}   # created by the staging Mautic project
    external: true
