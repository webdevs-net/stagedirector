# Stage Director engine: one self-hosted GitHub Actions runner with the deploy tools.
#
#   cp .env.example .env    # fill it in
#   docker compose up -d --build
#
# Portable: nothing host-specific lives here. Everything comes from .env. A second runner
# (another repo, another host, another label) is another folder or another .env with its own
# COMPOSE_PROJECT_NAME. Re-running `up -d` is safe; registration is kept in the `state` volume.
#
# Docker access is OFF by default: a job that can reach the Docker socket is root on the host.
# Turn it on only for a runner that must run `docker compose` on its own host:
#   docker compose -f docker-compose.yml -f docker-socket.yml up -d

name: ${COMPOSE_PROJECT_NAME:-stagedirector-runner}

services:
  runner:
    build:
      context: .
      args:
        RUNNER_VERSION: ${RUNNER_VERSION:-2.338.2}
        WRANGLER_VERSION: ${WRANGLER_VERSION:-3.99.0}
        APT_MIRROR: ${APT_MIRROR:-}
    image: stagedirector-runner:${RUNNER_VERSION:-2.338.2}
    restart: unless-stopped
    # Healthy while the runner's listener process is alive. Docker only marks it unhealthy;
    # engine/runner/watchdog.sh restarts it (and also checks GitHub says the runner is online).
    # The [.] keeps grep from matching its own command line.
    healthcheck:
      test: ["CMD-SHELL", "grep -lsa 'Runner[.]Listener' /proc/[0-9]*/cmdline >/dev/null"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s
    environment:
      GITHUB_URL: ${GITHUB_URL:?set GITHUB_URL in .env}
      RUNNER_NAME: ${RUNNER_NAME:?set RUNNER_NAME in .env}
      RUNNER_LABELS: ${RUNNER_LABELS:-self-hosted}
      RUNNER_TOKEN: ${RUNNER_TOKEN:-}
      # Run progress for a dashboard on the same machine (see engine/contract.md "Run progress file").
      STAGEDIRECTOR_PROGRESS_DIR: /home/runner/progress
    volumes:
      - state:/home/runner/state
      - work:/home/runner/_work
      - ${STAGEDIRECTOR_PROGRESS_HOST_DIR:-./progress}:/home/runner/progress
      - ${SSH_CONFIG_DIR:-./ssh}:/home/runner/ssh-config:ro
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    mem_limit: ${RUNNER_MEMORY:-900m}
    memswap_limit: ${RUNNER_MEMORY:-900m}
    cpus: ${RUNNER_CPUS:-1.0}
    pids_limit: 512
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  state:
  work:
